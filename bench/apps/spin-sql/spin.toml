# appfuzz bench app: spin-sql (a Spin component that pastes ?sku= into SQL),
# reviewed from its Spin manifest alone: no appfuzz.toml.
spin_manifest_version = 2

[application]
name = "spin-sql"

[[trigger.http]]
route = "/..."
component = "spin-sql"

[component.spin-sql]
source = "../../target/wasm32-wasip2/release/spin_sql.wasm"
key_value_stores = ["default"]
sqlite_databases = ["default"]
