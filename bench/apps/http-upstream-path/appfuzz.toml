# appfuzz bench app: http-upstream-path (?id= goes into the API path as it is).
[app]
wasm = "../../target/wasm32-wasip2/release/http_upstream_path.wasm"
name = "http-upstream-path"

[entry]
export = "wasi:http/incoming-handler#handle"
request = { method = "GET", uri = "https://app.example/?id=17", headers = [], body = "" }
output = { status = "status", body = "body", headers = "headers" }
now = "2026-11-02T10:00:00"

[grants]
hosts = ["api.example"]

[limits]
fuel = 200_000_000
memory = "64MiB"
cost_per_request = 100
max_latency_ms = 200
