# appfuzz bench app: spin-admin, reviewed from its Spin manifest alone.
spin_manifest_version = 2

[application]
name = "spin-admin"

[variables]
admin_token = { required = true, secret = true }

[[trigger.http]]
route = "/..."
component = "spin-admin"

[component.spin-admin]
source = "../../target/wasm32-wasip2/release/spin_admin.wasm"

[component.spin-admin.variables]
admin_token = "{{ admin_token }}"
