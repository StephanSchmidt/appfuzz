# appfuzz bench app: script-string-reflect (escapes ?q for HTML but not for the script string it puts it in).
[app]
wasm = "../../target/wasm32-wasip2/release/script_string_reflect.wasm"
name = "script-string-reflect"

[entry]
export = "bench:web/handler#handle"
request = { method = "GET", path = "/", query = [], form = [], today = "", now = "" }
fields = { today = "clock.date", now = "clock.time" }
output = { status = "status", body = "body", headers = "headers", body_format = "html" }
now = "2026-11-02T10:00:00"
result = { body = "html:scripts" }
sensitive_paths = ["/admin"]
csp = "default-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'"

[grants]
imports = []
wasi = ["wasi:cli", "wasi:clocks", "wasi:io", "wasi:random"]

[limits]
fuel = 200_000_000
memory = "64MiB"
cost_per_request = 100
max_latency_ms = 200
