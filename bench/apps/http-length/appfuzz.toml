# appfuzz bench app: http-length (Content-Length counted before escaping).
[app]
wasm = "../../target/wasm32-wasip2/release/http_length.wasm"
name = "http-length"

[entry]
export = "wasi:http/incoming-handler#handle"
request = { method = "GET", uri = "https://app.example/?name=ann", headers = [], body = "" }
output = { status = "status", body = "body", headers = "headers" }
now = "2026-11-02T10:00:00"

[limits]
fuel = 200_000_000
memory = "64MiB"
cost_per_request = 100
max_latency_ms = 200
