# appfuzz bench app: spin-admin-checked, reviewed from its Spin manifest alone.
spin_manifest_version = 2

[application]
name = "spin-admin-checked"

[variables]
admin_token = { required = true, secret = true }

[[trigger.http]]
route = "/..."
component = "spin-admin-checked"

[component.spin-admin-checked]
source = "../../target/wasm32-wasip2/release/spin_admin_checked.wasm"

[component.spin-admin-checked.variables]
admin_token = "{{ admin_token }}"
