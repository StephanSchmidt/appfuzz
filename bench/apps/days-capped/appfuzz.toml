# appfuzz bench app: days-capped (reads one day per ?days, which the platform caps at 31 (31 serial calls are still slow on a slow host)).
[app]
wasm = "../../target/wasm32-wasip2/release/days_capped.wasm"
name = "days-capped"

[entry]
export = "bench:web/handler#handle"
request = { method = "GET", path = "/", query = [], form = [], today = "", now = "" }
fields = { today = "clock.date", now = "clock.time" }
output = { status = "status", body = "body", headers = "headers", body_format = "html" }
now = "2026-11-02T10:00:00"
values = { "query.days" = "range:1..31" }

[grants]
imports = ["bench:web/items"]
wasi = ["wasi:cli", "wasi:clocks", "wasi:io", "wasi:random"]

[limits]
fuel = 200_000_000
memory = "64MiB"
cost_per_request = 100
max_latency_ms = 200
