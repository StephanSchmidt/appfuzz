# appfuzz bench app: customers-export-limit-clamped (lists as many customers as ?limit= asks for, at most 100).
[app]
wasm = "../../target/wasm32-wasip2/release/customers_export_limit_clamped.wasm"
name = "customers-export-limit-clamped"

[entry]
export = "bench:web/handler#handle"
request = { method = "GET", path = "/", query = [], form = [], today = "", now = "" }
fields = { today = "clock.date", now = "clock.time" }
output = { status = "status", body = "body", headers = "headers", body_format = "html" }
now = "2026-11-02T10:00:00"

[grants]
