# appfuzz language test: a wasi:http handler in JavaScript (StarlingMonkey
# fetch event) that fetches a quote from one fixed API.
[app]
wasm = "app.wasm"
name = "js-http"

[entry]
export = "wasi:http/incoming-handler#handle"
request = { method = "GET", uri = "https://app.example/?symbol=ACME", headers = [], body = "" }
output = { status = "status", body = "body", headers = "headers" }
now = "2026-11-02T10:00:00"

[grants]
hosts = ["api.example"]
wasi = ["wasi:cli", "wasi:clocks", "wasi:io", "wasi:random", "wasi:http"]

[limits]
fuel = 200_000_000
memory = "64MiB"
cost_per_request = 100
max_latency_ms = 200
