# Fastly Compute, as an appfuzz platform.
#
# The types come from Fastly's witx (vendored from Viceroy, see witx/SOURCE).
# Functions without a description here use the witx doc comments.
# Descriptions are for the agents that write apps; `appfuzz platform docs
# --platform fastly` prints them with the signatures.

[platform]
name = "fastly"
version = "compute-at-edge-abi viceroy@d338a425"
description = """
Fastly Compute runs one WebAssembly module (wasm32-wasip1) per client request.
The app gets the client request through the host (`fastly_http_req#body_downstream_get`),
may send requests to named backends, and answers with one response
(`fastly_http_resp#send_downstream`). Requests, responses and bodies are handles."""
sdk = "fastly crate 0.13 (Rust)"
witx = ["builtin:fastly"]
start = "_start"
bad_handle = "badf"
absent = "none"
# How appfuzz sees one run: the client request in, the response sent out.
entry_wit = """
record request { method: string, uri: string, headers: list<tuple<string, string>>, body: string }
record response { status: u16, headers: list<tuple<string, string>>, body: string }
handle: func(request: request) -> response;
"""

# `fails = false`: the Fastly SDK treats a failure of the call as impossible
# (it panics), so appfuzz does not inject one.
#
# Handles keep state for a run; `handle = {...}` on a function binds it to
# that state. The client request (the run's request) is the state of the
# handles body_downstream_get returns; send_downstream's response and body
# are the run's result.
[handles.request_handle]
init = { method = "GET", uri = "", headers = [], version = "http11" }

[handles.response_handle]
init = { status = 200, headers = [], version = "http11" }

[handles.body_handle]

[entry]
export = "entry#handle"
request = { method = "GET", uri = "https://app.example/", headers = [], body = "" }
output = { status = "status", body = "body", headers = "headers" }
# Fastly parses the client's HTTP before the app runs: the method is a
# token and the URI an absolute URL.
values = { method = "format:token", uri = "format:url" }

[grants]
wasi = ["wasi_snapshot_preview1"]

# From Fastly's documented service limits. `fuel` is an estimate of 50 ms of
# CPU at limits.ns_per_fuel; `max_latency_ms` is the 2 minute wall-clock limit.
[limits]
memory = "128MiB"
fuel = 100_000_000
max_latency_ms = 120_000

[functions."fastly_http_req#body_downstream_get"]
description = "The client request this instance serves, as a request handle and a body handle."
result_doc = "(request handle, body handle) of the client request."
sdk = "Request::from_client()"
handle = { op = "downstream", kind = "request_handle", body_kind = "body_handle" }
fails = false

[functions."fastly_http_req#send_v2"]
description = "Sends a request to a backend and waits for its response."
param_docs = { h = "The request to send.", b = "The request body; it is consumed.", backend = "The name of a backend configured for the service, or of a dynamic backend." }
result_doc = "The response handle and its body handle. On failure, error-detail says why."
sdk = "Request::send(backend)"

[functions."fastly_http_req#send_async_v2"]
description = "Sends a request to a backend without waiting; wait on the pending request for the response."
param_docs = { h = "The request to send.", b = "The request body; it is consumed.", backend = "The name of a backend configured for the service.", streaming = "1 to keep writing the body after sending." }
result_doc = "A pending request handle."
sdk = "Request::send_async(backend)"

[functions."fastly_http_req#pending_req_wait_v2"]
description = "Waits for a request sent with send_async and returns its response."
param_docs = { h = "The pending request." }
sdk = "PendingRequest::wait()"

[functions."fastly_http_req#uri_get"]
description = "The request's full URL."
param_docs = { h = "The request." }
sdk = "Request::get_url_str()"
handle = { op = "get", field = "uri" }
fails = false

[functions."fastly_http_req#uri_set"]
description = "Sets the request's URL."
param_docs = { h = "The request.", uri = "The new URL." }
sdk = "Request::set_url(url)"
handle = { op = "set", field = "uri" }
fails = false

[functions."fastly_http_req#method_get"]
description = "The request's method, e.g. GET or POST."
param_docs = { h = "The request." }
sdk = "Request::get_method()"
handle = { op = "get", field = "method" }
fails = false

[functions."fastly_http_req#header_value_get"]
description = "The first value of a request header."
param_docs = { h = "The request.", name = "The header name." }
errors = { none = "the header is absent" }
sdk = "Request::get_header(name)"
handle = { op = "map_get", field = "headers", key = "name" }
fails = false

[functions."fastly_http_req#header_insert"]
description = "Sets a request header, replacing its values."
param_docs = { h = "The request.", name = "The header name.", value = "The header value." }
sdk = "Request::set_header(name, value)"
handle = { op = "map_insert", field = "headers", key = "name", value = "value" }
fails = false

[functions."fastly_http_resp#new"]
description = "A new, empty response (status 200)."
sdk = "Response::new()"
handle = { op = "new", kind = "response_handle" }
fails = false

[functions."fastly_http_resp#status_set"]
description = "Sets the response's status code."
param_docs = { h = "The response.", status = "The HTTP status, 100 to 999." }
sdk = "Response::set_status(status)"
handle = { op = "set", field = "status" }
fails = false

[functions."fastly_http_resp#header_insert"]
description = "Sets a response header, replacing its values."
param_docs = { h = "The response.", name = "The header name.", value = "The header value." }
sdk = "Response::set_header(name, value)"
handle = { op = "map_insert", field = "headers", key = "name", value = "value" }
fails = false

[functions."fastly_http_resp#header_value_get"]
description = "The first value of a response header."
param_docs = { h = "The response.", name = "The header name." }
errors = { none = "the header is absent" }
sdk = "Response::get_header(name)"
handle = { op = "map_get", field = "headers", key = "name" }
fails = false

[functions."fastly_http_resp#send_downstream"]
description = "Sends the response to the client. An instance answers once."
param_docs = { h = "The response.", b = "The response body.", streaming = "1 to keep writing the body after sending." }
sdk = "Response::send_to_client()"
handle = { op = "respond", handle = "h", body = "b" }
fails = false

[functions."fastly_http_body#new"]
description = "A new, empty body."
sdk = "Body::new()"
handle = { op = "new", kind = "body_handle" }
fails = false

[functions."fastly_http_body#read"]
description = "Reads the next bytes of a body. An empty result means the body is done."
param_docs = { h = "The body." }
sdk = "Body::read / Body::into_string()"
handle = { op = "read" }
fails = false

[functions."fastly_http_body#write"]
description = "Writes bytes to the front or back of a body."
param_docs = { h = "The body.", buf = "The bytes to write.", end = "Where to write: back or front." }
sdk = "Body::write_bytes(bytes)"
handle = { op = "write", value = "buf" }
fails = false

[functions."fastly_http_body#append"]
description = "Moves the contents of one body to the end of another."
param_docs = { dest = "The body to append to.", src = "The body appended; it is consumed." }
sdk = "Body::append(other)"
handle = { op = "append" }
fails = false

[functions."fastly_config_store#open"]
description = "Opens a config store linked to the service, by name."
param_docs = { name = "The store's name." }
sdk = "ConfigStore::open(name)"

[functions."fastly_config_store#get"]
description = "A value from a config store."
param_docs = { h = "The store.", key = "The key." }
errors = { none = "the key is absent" }
sdk = "ConfigStore::get(key)"

[functions."fastly_secret_store#open"]
description = "Opens a secret store linked to the service, by name."
param_docs = { name = "The store's name." }
sdk = "SecretStore::open(name)"

[functions."fastly_secret_store#get"]
description = "A secret from a secret store, as a handle; read it with plaintext."
param_docs = { store = "The store.", key = "The secret's name." }
sdk = "SecretStore::get(key)"

[functions."fastly_secret_store#plaintext"]
description = "The secret's value."
param_docs = { secret = "The secret." }
result = "secret"
sdk = "Secret::plaintext()"

[functions."fastly_http_req#new"]
handle = { op = "new", kind = "request_handle" }
fails = false

[functions."fastly_http_req#close"]
handle = { op = "close" }
fails = false

[functions."fastly_http_resp#close"]
handle = { op = "close" }
fails = false

[functions."fastly_http_resp#status_get"]
handle = { op = "get", field = "status" }
fails = false

[functions."fastly_http_body#close"]
handle = { op = "close" }
fails = false

[functions."fastly_http_body#abandon"]
handle = { op = "close" }
fails = false

[functions."fastly_http_req#version_get"]
handle = { op = "get", field = "version" }
fails = false

[functions."fastly_http_req#version_set"]
handle = { op = "set", field = "version" }
fails = false

[functions."fastly_http_req#header_names_get"]
handle = { op = "map_keys", field = "headers" }
fails = false

[functions."fastly_http_req#header_values_get"]
handle = { op = "map_values", field = "headers", key = "name" }
fails = false

[functions."fastly_http_req#header_append"]
handle = { op = "map_append", field = "headers", key = "name", value = "value" }
fails = false

[functions."fastly_http_req#header_remove"]
handle = { op = "map_remove", field = "headers", key = "name" }
fails = false

[functions."fastly_http_resp#version_get"]
handle = { op = "get", field = "version" }
fails = false

[functions."fastly_http_resp#version_set"]
handle = { op = "set", field = "version" }
fails = false

[functions."fastly_http_resp#header_names_get"]
handle = { op = "map_keys", field = "headers" }
fails = false

[functions."fastly_http_resp#header_values_get"]
handle = { op = "map_values", field = "headers", key = "name" }
fails = false

[functions."fastly_http_resp#header_append"]
handle = { op = "map_append", field = "headers", key = "name", value = "value" }
fails = false

[functions."fastly_http_resp#header_remove"]
handle = { op = "map_remove", field = "headers", key = "name" }
fails = false

[functions."fastly_http_req#method_set"]
handle = { op = "set", field = "method" }
fails = false

[functions."fastly_http_req#framing_headers_mode_set"]
fails = false

[functions."fastly_http_resp#framing_headers_mode_set"]
fails = false

[functions."fastly_http_req#auto_decompress_response_set"]
fails = false

[functions."fastly_http_req#cache_override_v2_set"]
fails = false

[functions."fastly_http_req#header_values_set"]
fails = false

[functions."fastly_http_resp#header_values_set"]
fails = false

[functions."fastly_http_body#trailer_append"]
fails = false
