<!doctype html><body><button id=target>tap</button><script>window.records=[];window.optionReads=0;const button=document.getElementById('target');for(const type of ['pointerdown','mousedown','focus','pointerup','mouseup','click'])button.addEventListener(type,e=>{const row=[e.type,e.button,e.buttons,e.pointerId,e.pointerType,e.isPrimary,e.pressure,e.detail,e.isTrusted,e.view===window,e.relatedTarget===null].join(' ');records.push(row);console.log(row);if(e.type==='click')console.log('reads '+optionReads)});for(const key of ['bubbles','cancelable','composed','detail','view'])Object.defineProperty(Object.prototype,key,{configurable:true,get(){optionReads++;return undefined}});for(const Type of [MouseEvent,PointerEvent,FocusEvent])Object.setPrototypeOf(Type,function(){throw Error('public parent')});</script>
