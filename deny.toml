# cargo deny check: advisories, licenses, banned crates, sources.
# wasmtime is the sandbox: a RustSec advisory against it fails CI.

[graph]
all-features = true

[advisories]
# Unmaintained crates and yanked versions fail too. To accept one,
# add it with a reason: ignore = [{ id = "RUSTSEC-…", reason = "…" }]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only: appfuzz ships MIT binaries.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
