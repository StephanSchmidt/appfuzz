name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
      # The bench: builds bench/apps and reviews each.
      - run: cargo test --release -p appfuzz --test bench -- --ignored bench --nocapture
        env:
          BENCH_TIME: 10s
