name: release

# Push a tag like v0.1.0 to build the binaries and publish a GitHub release.
# install.sh downloads appfuzz-<target>.tar.gz and its .sha256 from it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Static builds for Alpine and for Linux older than the glibc builds
          # need; install.sh picks them.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # ring, zstd and mimalloc have C code, compiled here against musl.
      - if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p appfuzz --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name=appfuzz-${{ matrix.target }}.tar.gz
          mkdir dist
          tar -czf "dist/$name" -C target/${{ matrix.target }}/release appfuzz
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The installer is a release asset too, so a release can be installed
      # without the website.
      - run: cp install.sh dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # Point the Homebrew formula in StephanSchmidt/homebrew-appfuzz at this
  # release. HOMEBREW_APPFUZZ_TOKEN: fine-grained token, contents read/write
  # on that repo only.
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          TOKEN: ${{ secrets.HOMEBREW_APPFUZZ_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TOKEN}@github.com/StephanSchmidt/homebrew-appfuzz.git" tap
          .github/homebrew/render.sh "$version" dist > tap/appfuzz.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appfuzz.rb
          git diff --cached --quiet && exit 0
          git commit -m "appfuzz $version"
          git push
