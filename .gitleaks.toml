# Default rules plus allowlisted test fixtures. appfuzz generates fake
# secrets on purpose (secret markers, canaries); list each fixture exactly.
[extend]
useDefault = true

[[allowlists]]
description = "fake keys in unit tests"
regexTarget = "match"
regexes = ['''sk_live_0123456789''']

[[allowlists]]
description = "forged JWTs that probe auth sends (unsigned, wrong signature)"
regexTarget = "match"
regexes = [
  '''eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.eyJzdWIiOiIxIiwibmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwiYWRtaW4iOnRydWUsImlhdCI6MTc2NzIyNTYwMCwiZXhwIjo0MTAyNDQ0ODAwfQ\.''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxIiwibmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwiYWRtaW4iOnRydWUsImlhdCI6MTc2NzIyNTYwMCwiZXhwIjo0MTAyNDQ0ODAwfQ\.YWZ6LWZvcmdlZC1zaWduYXR1cmUtMDAwMDAwMDAwMA''',
]

[[allowlists]]
description = "finding ids that tests compare with (hashes, not keys)"
regexTarget = "match"
regexes = ['''f4a3de7ef2287523b1e5a4f215486b038''']
